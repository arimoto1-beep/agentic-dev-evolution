[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "note2slides"
version = "0.1.0"
description = "note 記事(Markdown)から eラーニング用のプレゼンテーション(.pptx)を生成する"
requires-python = ">=3.10"
dependencies = [
    "python-pptx>=1.0",
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pypdfium2>=4.0",  # tools/preview_pptx.py で生成結果を画像にする
]

[project.scripts]
note2slides = "note2slides.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# 一時ファイルはリポジトリ内に置き、環境によらず同じ場所を使う
addopts = "--basetemp=build/pytest-tmp"
markers = ["slow: 外部ツール(LibreOffice)を起動する時間のかかるテスト"]
