[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "note2slides"
version = "0.1.0"
description = "note 記事(Markdown)から eラーニング用のプレゼンテーション(.pptx)・スライド画像・ナレーション音声を生成する"
requires-python = ">=3.10"
dependencies = [
    "python-pptx>=1.0",
    "markdown-it-py>=3.0",
    "pypdfium2>=4.0",  # PDF をスライド画像に描画する
    "pillow>=10.0",    # 描画結果を PNG / JPEG として書き出す
    "numpy>=1.26",     # 音声の組み立てと音量測定(ITU-R BS.1770)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
note2slides = "note2slides.cli:main"
note2slides-images = "note2slides.images_cli:main"
note2slides-audio = "note2slides.audio_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# 音声合成は PowerShell 経由で呼ぶため、スクリプトを一緒に配置する。
note2slides = ["*.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# 一時ファイルはリポジトリ内に置き、環境によらず同じ場所を使う
addopts = "--basetemp=build/pytest-tmp"
markers = ["slow: 外部ツール(LibreOffice / 音声合成)を起動する時間のかかるテスト"]
